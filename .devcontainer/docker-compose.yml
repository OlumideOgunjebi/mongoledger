# Containers for GitHub Codespaces (used by devcontainer.json).
# mongo: MongoDB 8.0 started with --replSet; its health check initiates the
#        replica set on first start and reports healthy once it is PRIMARY.
# app:   Python workspace sharing the mongo network namespace, so
#        mongodb://localhost:27017 reaches the server from the editor terminal.
services:
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) {
        rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}); quit(1) }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    command: sleep infinity
    network_mode: service:mongo
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ../..:/workspaces:cached

volumes:
  mongo_data:
