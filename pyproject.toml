# Packaging for the change stream ledger.
#
#   pip install -e .                 editable install for development (adds the mongoledger command)
#   pip install -e ".[bench,test]"   plus plotting and the test runner
#   pip install -e ".[sqlserver]"    plus pyodbc for the SQL Server baseline (needs ODBC Driver 18)
#   python -m pip wheel . -w dist --no-deps    builds dist/mongoledger-1.0.0-py3-none-any.whl

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mongoledger"
version = "1.0.0"
description = "Tamper evidence for an unmodified MongoDB replica set: change stream and in transaction ledgers with Merkle blocks and external digests"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Olumide Ogunjebi", email = "ogunjeb@uwindsor.ca" },
  { name = "Rohith Nelluri", email = "nellurir@uwindsor.ca" },
  { name = "Yadu Pratap", email = "Singh8a4@uwindsor.ca" },
]
dependencies = ["pymongo>=4.8"]

[project.optional-dependencies]
bench = ["matplotlib>=3.8"]
test = ["pytest>=8"]
sqlserver = ["pyodbc>=5.1"]

[project.scripts]
mongoledger = "ledger.cli:main"

[tool.setuptools]
packages = ["ledger", "workloads", "bench", "attacks", "sqlserver"]

[tool.setuptools.package-data]
sqlserver = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
